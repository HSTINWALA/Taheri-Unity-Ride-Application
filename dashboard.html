<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard – Taheri Unity Ride 2026</title>
<link rel="stylesheet" href="common.css">
<style>
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpis b{display:block;font-size:2rem;color:var(--ac)}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pod{border-radius:12px;padding:14px;background:#0e1932;border:2px solid var(--line)}.pod.p1{border-color:#f1c40f}.pod.p2{border-color:#c0c8d8}.pod.p3{border-color:#cd7f32}
.pod .nm{font-size:1.2rem;font-weight:700}
.cpbar{display:flex;align-items:center;gap:10px;margin:6px 0}.cpbar span{width:140px;font-size:.85rem}.cpbar i{display:block;height:14px;border-radius:7px;background:var(--sky);min-width:2px}
</style></head><body>
<header><img src="logo.jpg" alt=""><h1>Taheri Unity Ride 2026<small>Live dashboard (view only) <span id="upd"></span></small></h1><button class="btn ghost sm" id="out" style="display:none" onclick="logout()">Log out</button></header>
<main id="lg" style="max-width:420px"><div class="panel"><h2>Dashboard login</h2>
<label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&login()">
<button class="btn" style="width:100%" onclick="login()">Log in</button></div></main>
<main id="shell" style="display:none"><section id="dash"></section></main>
<div id="toast"></div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
window.TOK='dtok';
let S={Participants:[],Checkpoints:[],Scans:[],ActivityLogs:[]},last='';
const cps=()=>[...S.Checkpoints].sort((a,b)=>a.order-b.order);
function board(){const c=cps(),end=c[c.length-1],by={};
 S.Scans.forEach(s=>{(by[s.participantId]=by[s.participantId]||{})[s.checkpointId]=s.time});
 const ac={};S.ActivityLogs.forEach(l=>{if(l.end)(ac[l.participantId]=ac[l.participantId]||new Set()).add(l.activityId)});
 const rows=S.Participants.map(p=>{const m=by[p.id]||{},t=Object.values(m).sort();return{p,m,n:t.length,last:t[t.length-1]||'',fin:end?m[end.id]||'':'',acts:(ac[p.id]||new Set()).size}});
 rows.sort((a,b)=>(!!b.fin-!!a.fin)||(a.fin&&b.fin?a.fin.localeCompare(b.fin):0)||(b.n-a.n)||((a.last||'z').localeCompare(b.last||'z')));
 let rk=0;rows.forEach(r=>r.rank=(r.fin&&r.n>=c.length&&r.acts>=2)?++rk:0);   // ranked only if all checkpoints + both activities completed
 return{rows,c,end}}

function actPanel(){return ACTS.map(a=>{const L=S.ActivityLogs.filter(x=>x.activityId==a.id),done=L.filter(x=>x.end),ds=x=>(new Date(x.end)-new Date(x.start))/1000,w=x=>parseFloat(x.result);
 const top=done.filter(x=>a.id=='A1'?isFinite(w(x)):true).sort((p,q)=>a.id=='A1'?((w(q)-w(p))||ds(p)-ds(q)):ds(p)-ds(q)).slice(0,3);
 const nm=id=>(S.Participants.find(p=>p.id==id)||{}).name||id;
 return `<div class="panel"><h2>${esc(a.name)}</h2><p style="color:var(--mu)">Started ${L.length} · Completed ${done.length} · ranked by ${a.id=='A1'?'highest weight, then least time':'least duration'}</p>${top.map((x,i)=>`<div>${['🥇','🥈','🥉'][i]} <b>${esc(nm(x.participantId))}</b> (${esc(x.participantId)}) – ${a.id=='A1'?esc(x.result)+' kg · ':''}${durTxt(x.start,x.end)}</div>`).join('')||'<p>No completed entries yet.</p>'}</div>`}).join('')}
function renderDash(){const{rows,c,end}=board(),fin=rows.filter(r=>r.fin),started=rows.filter(r=>r.n),mx=Math.max(1,S.Participants.length);
 const g=k=>S.Participants.filter(p=>String(p.gender).toLowerCase()==k).length;
 const pod=rows.filter(r=>r.rank).slice(0,3).map(r=>`<div class="pod p${r.rank}"><div>Position ${r.rank}</div><div class="nm">${esc(r.p.name)}</div><div>${esc(r.p.id)} · finished ${fmt(r.fin)}</div>${r.p.verifiedPos==r.rank?'<span class="tag ok">✔ Verified</span>':''}</div>`).join('')||'<p style="color:var(--mu)">No qualified participant yet. The podium lists those who completed all checkpoints and both activities, in order of finish time.</p>';
 $('#dash').innerHTML=`<div class="kpis"><div><b>${S.Participants.length}</b>Participants</div><div><b>${started.length}</b>Started</div><div><b>${fin.length}</b>Finished</div><div><b>${rows.filter(r=>r.rank).length}</b>Completed everything</div><div><b>${g('male')} / ${g('female')}</b>Male / Female</div></div>
 <div class="panel"><h2>Podium</h2><div class="podium">${pod}</div></div>
 <div class="panel"><h2>Checkpoint progress</h2>${c.map(k=>{const n=S.Scans.filter(s=>s.checkpointId==k.id).length;return`<div class="cpbar"><span>${esc(k.name)}</span><i style="width:${n/mx*60}%"></i> ${n}</div>`}).join('')||'<p>No checkpoints yet.</p>'}</div>
 ${actPanel()}
 <div class="panel"><h2>Live leaderboard</h2><div class="tw"><table><tr><th>#</th><th>ID</th><th>Name</th>${c.map(k=>`<th>${esc(k.name)}</th>`).join('')}<th>Status</th></tr>
 ${rows.map(r=>`<tr><td>${r.rank||''}</td><td>${esc(r.p.id)}</td><td>${esc(r.p.name)}</td>${c.map(k=>`<td>${fmt(r.m[k.id])}</td>`).join('')}<td>${r.rank?'<span class="tag ok">Finished</span>':r.fin?`<span class="tag">Finished · activities ${r.acts}/2</span>`:r.n?`<span class="tag">${r.n}/${c.length}</span>`:'Not started'}${r.p.verifiedPos?` <span class="tag ok">Verified #${esc(r.p.verifiedPos)}</span>`:''}</td></tr>`).join('')}</table></div></div>`}
async function login(){const r=await api('login',{role:'viewer',user:$('#u').value.trim(),pass:$('#p').value});
 if(!r.ok)return toast(r.error,'err',4000);if(r.session.role!=='viewer')return toast('Not a dashboard login','err');localStorage.setItem('dtok',r.token);boot()}
function logout(){localStorage.removeItem('dtok');location.reload()}
async function load(){const r=await api('state');if(r.error==='auth')return logout();if(!r.ok)return toast(r.error,'err');
 $('#upd').textContent='· updated '+new Date().toLocaleTimeString();const j=JSON.stringify(r.data);if(j===last)return;last=j;S=r.data;renderDash()}
async function boot(){if(!localStorage.getItem('dtok'))return;$('#lg').style.display='none';$('#shell').style.display='block';$('#out').style.display='';
 await load();setInterval(()=>{if(!document.hidden)load()},10000)}
boot();
</script></body></html>
