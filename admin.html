<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Taheri Unity Ride 2026</title>
<link rel="stylesheet" href="common.css">
<style>
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#0e1932;border-bottom:1px solid var(--line)}
nav button{background:transparent;color:var(--mu);border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.95rem}
nav button.on{background:var(--ac);color:#1b1205;font-weight:700}
.tab{display:none}.tab.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpis b{display:block;font-size:2rem;color:var(--ac)}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pod{border-radius:12px;padding:14px;background:#0e1932;border:2px solid var(--line)}.pod.p1{border-color:#f1c40f}.pod.p2{border-color:#c0c8d8}.pod.p3{border-color:#cd7f32}
.pod .nm{font-size:1.2rem;font-weight:700}
.cpbar{display:flex;align-items:center;gap:10px;margin:6px 0}.cpbar span{width:140px;font-size:.85rem}.cpbar i{display:block;height:14px;border-radius:7px;background:var(--sky);min-width:2px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;width:min(420px,92vw)}dialog::backdrop{background:#000a}
#cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(85mm,max-content));gap:16px;justify-content:center}
.cwrap{display:flex;flex-direction:column;gap:8px;align-items:center;break-inside:avoid}
.pcard{width:85mm;height:130mm;background:#fff;color:#111;border:.4mm solid #14213d;border-radius:4mm;overflow:hidden;display:flex;flex-direction:column;text-align:center;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
.pcard .hd{background:#14213d;color:#fff;display:flex;align-items:center;gap:3mm;padding:3mm 4mm;height:25mm;border-bottom:1.2mm solid #f08a24;flex:none}
.pcard .hd img{width:17mm;height:17mm;border-radius:50%;object-fit:cover;flex:none;background:#fff}
.pcard .ev{flex:1;min-width:0;font-size:10.5pt;font-weight:800;line-height:1.2;white-space:nowrap}.pcard .ev small{display:block;color:#f08a24;font-size:7.5pt;font-weight:600;margin-top:1mm}
.pcard .nm{font-size:20pt;font-weight:800;margin:3mm 3mm 0;line-height:1.1;min-height:11mm;display:flex;align-items:center;justify-content:center}
.pcard .its{font-size:15pt;font-weight:700;margin-top:1mm;min-height:6mm}
.pcard .ag{font-size:10pt;color:#444;margin-top:.5mm;min-height:4.5mm}
.pcard .qr{margin:2mm auto 0;width:46mm;height:46mm}.pcard .qr img{width:100%;height:100%}
.pcard .pid{font:700 13pt monospace;color:#c96a0a;margin-top:2mm}
.pcard .ft{margin-top:auto;background:#f08a24;font-size:7.5pt;padding:2mm;font-weight:700;color:#1b1205}
@media print{@page{size:A4;margin:8mm}header,nav,.noprint,#toast{display:none!important}body{background:#fff}main{padding:0}.panel{border:0;background:none;padding:0}#cardgrid{grid-template-columns:repeat(2,85mm);gap:6mm}}
</style></head><body>
<header class="noprint"><img src="logo.jpg" alt=""><h1>Taheri Unity Ride 2026<small>Admin portal – Burhani Guards Division-II</small></h1><button class="btn ghost sm" id="out" style="display:none" onclick="logout()">Log out</button></header>

<main id="lg" style="max-width:420px"><div class="panel"><h2>Admin login</h2>
<label>Username</label><input id="u"><label>Password</label><input id="p" type="password" onkeydown="event.key=='Enter'&&login()">
<button class="btn" style="width:100%" onclick="login()">Log in</button></div></main>

<div id="shell" style="display:none">
<nav id="nav"></nav>
<main>
<section class="tab" id="dash"></section>
<section class="tab" id="Participants"></section>
<section class="tab" id="Volunteers"></section>
<section class="tab" id="Checkpoints"></section>
<section class="tab" id="act"></section>
<section class="tab" id="ActivityUsers"></section>
<section class="tab" id="scan"><div class="panel"><h2>Scan as admin (any checkpoint)</h2>
<label>Checkpoint</label><select id="scp"></select><label style="display:block;margin-bottom:10px"><input type="checkbox" id="force" style="width:auto;margin:0 6px 0 0">Override checkpoint sequence (allow skipping previous checkpoint)</label><div id="reader"></div><div id="sres" style="text-align:center;margin:12px 0;font-size:1.1rem"></div>
<div class="bar"><input id="sman" placeholder="Or type participant ID" style="flex:1"><button class="btn" onclick="doScan($('#sman').value)">Record</button></div></div></section>
<section class="tab" id="cards"><div class="panel"><div class="bar noprint"><h2>Participant cards</h2><input id="cq" placeholder="Filter name or ID" oninput="renderCards()"><button class="btn ghost" onclick="allPNG()">Download all PNG</button><button class="btn" onclick="print()">Print cards</button></div><div id="cardgrid"></div></div></section>
</main></div>
<dialog id="dlg"><form method="dialog" id="frm" onsubmit="return false"></form></dialog>
<div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="common.js"></script>
<script>
window.TOK='atok';
const ENT={
 Participants:{key:'id',f:[['id','ID'],['name','Name'],['its','ITS'],['age','Age','number'],['phone','Mobile'],['gender','Gender','sel',['Male','Female']]]},
 Volunteers:{key:'username',f:[['username','Username'],['password','Password','password'],['name','Name'],['phone','Phone'],['checkpointId','Assigned checkpoint','cp']]},
 ActivityUsers:{key:'username',f:[['username','Username'],['password','Password','password'],['name','Name'],['phone','Phone'],['activityId','Activity','act']]},
 Checkpoints:{key:'id',f:[['id','ID (e.g. CP1)'],['name','Name'],['order','Order (1 = start, highest = finish)','number']]}};
const TABS=[['dash','Dashboard'],['Participants','Participants'],['Volunteers','Volunteers'],['Checkpoints','Checkpoints'],['act','Activities'],['ActivityUsers','Activity Users'],['scan','Scan'],['cards','Cards']];
let S={Participants:[],Volunteers:[],Checkpoints:[],Scans:[],ActivityLogs:[],ActivityUsers:[]},cur='dash',Q={};
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="show('${t[0]}')">${t[1]}</button>`).join('');
async function login(){const r=await api('login',{role:'admin',user:$('#u').value.trim(),pass:$('#p').value});
 if(!r.ok)return toast(r.error,'err',4000);localStorage.setItem('atok',r.token);boot()}
function logout(){localStorage.removeItem('atok');stopScan();location.reload()}
async function load(){const r=await api('state');if(r.error==='auth')return logout();if(!r.ok)return toast(r.error,'err');S=r.data;render()}
async function boot(){if(!localStorage.getItem('atok'))return;$('#lg').style.display='none';$('#shell').style.display='block';$('#out').style.display='';
 await load();show('dash');setInterval(()=>{if(!$('#dlg').open&&cur=='dash')load()},15000)}
function show(t){cur=t;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==t));
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
 t=='scan'?startScan(doScan):stopScan();render()}
const cpName=id=>(S.Checkpoints.find(c=>c.id==id)||{}).name||id||'–';
const cps=()=>[...S.Checkpoints].sort((a,b)=>a.order-b.order);
function render(){if(cur=='dash')renderDash();else if(ENT[cur])renderEnt(cur);else if(cur=='act')renderAct();else if(cur=='scan')$('#scp').innerHTML=cps().map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');else if(cur=='cards')renderCards()}

function board(){const c=cps(),end=c[c.length-1],by={};
 S.Scans.forEach(s=>{(by[s.participantId]=by[s.participantId]||{})[s.checkpointId]=s.time});
 const rows=S.Participants.map(p=>{const m=by[p.id]||{},t=Object.values(m).sort();return{p,m,n:t.length,last:t[t.length-1]||'',fin:end?m[end.id]||'':''}});
 rows.sort((a,b)=>(!!b.fin-!!a.fin)||(a.fin&&b.fin?a.fin.localeCompare(b.fin):0)||(b.n-a.n)||((a.last||'z').localeCompare(b.last||'z')));
 let rk=0;rows.forEach(r=>r.rank=r.fin?++rk:0);return{rows,c,end}}
function renderDash(){const{rows,c,end}=board(),fin=rows.filter(r=>r.fin),started=rows.filter(r=>r.n);
 const pod=fin.slice(0,3).map(r=>`<div class="pod p${r.rank}"><div>Position ${r.rank}</div><div class="nm">${esc(r.p.name)}</div><div>${esc(r.p.id)} · finished ${fmt(r.fin)}</div>
  ${r.p.verifiedPos==r.rank?'<span class="tag ok">✔ Verified</span>':`<button class="btn sm" style="margin-top:8px" onclick="verify('${esc(r.p.id)}',${r.rank})">Verify position ${r.rank}</button>`}</div>`).join('')||'<p style="color:var(--mu)">No finisher yet. The first scan at the finish checkpoint will appear here.</p>';
 const mx=Math.max(1,S.Participants.length);
 $('#dash').innerHTML=`<div class="kpis"><div><b>${S.Participants.length}</b>Participants</div><div><b>${started.length}</b>Started</div><div><b>${fin.length}</b>Finished</div><div><b>${S.Volunteers.length}</b>Volunteers</div></div>
 <div class="panel"><h2>Podium</h2><div class="podium">${pod}</div></div>
 <div class="panel"><h2>Checkpoint progress</h2>${c.map(k=>{const n=S.Scans.filter(s=>s.checkpointId==k.id).length;return`<div class="cpbar"><span>${esc(k.name)}</span><i style="width:${n/mx*60}%"></i> ${n}</div>`}).join('')||'<p>Add checkpoints first.</p>'}</div>
 <div class="panel"><div class="bar"><h2>Live leaderboard</h2><button class="btn ghost sm" onclick="load()">Refresh</button></div><div class="tw"><table><tr><th>#</th><th>ID</th><th>Name</th>${c.map(k=>`<th>${esc(k.name)}</th>`).join('')}<th>Status</th></tr>
 ${rows.map(r=>`<tr><td>${r.rank||''}</td><td>${esc(r.p.id)}</td><td>${esc(r.p.name)}</td>${c.map(k=>`<td>${fmt(r.m[k.id])}</td>`).join('')}<td>${r.fin?'<span class="tag ok">Finished</span>':r.n?`<span class="tag">${r.n}/${c.length}</span>`:'Not started'}${r.p.verifiedPos?` <span class="tag ok">Verified #${esc(r.p.verifiedPos)}</span>`:''}</td></tr>`).join('')}</table></div></div>`}
async function verify(id,pos){const p=S.Participants.find(x=>x.id==id);const r=await api('save',{sheet:'Participants',row:{...p,verifiedPos:pos}});r.ok?(toast('Position '+pos+' verified'),load()):toast(r.error,'err')}

function renderEnt(n){const E=ENT[n],q=(Q[n]||'').toLowerCase();
 const list=S[n].map((r,i)=>[r,i]).filter(([r])=>JSON.stringify(r).toLowerCase().includes(q));
 if(n=='Checkpoints')list.sort((a,b)=>a[0].order-b[0].order);
 $('#'+n).innerHTML=`<div class="panel"><div class="bar"><h2>${n} (${S[n].length})</h2><input placeholder="Search" value="${esc(Q[n]||'')}" oninput="Q['${n}']=this.value;renderEnt('${n}')" id="s${n}"><button class="btn" onclick="edit('${n}')">+ Add</button></div>
 <div class="tw"><table><tr>${E.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${list.map(([r,i])=>`<tr>${E.f.map(f=>`<td>${f[2]=='password'?'••••••':esc(f[2]=='cp'?cpName(r[f[0]]):f[2]=='act'?(ACTS.find(x=>x.id==r[f[0]])||{}).name:r[f[0]])}</td>`).join('')}<td>
 <button class="btn ghost sm" onclick="edit('${n}',${i})">Edit</button> ${n=='Participants'?`<button class="btn ghost sm" onclick="$('#cq').value='${esc(r.id)}';show('cards')">Card</button> <button class="btn ghost sm" onclick="cardPNG(S.Participants[${i}])">PNG</button> `:''}<button class="btn red sm" onclick="del('${n}',${i})">Delete</button></td></tr>`).join('')}</table></div></div>`;
 const s=$('#s'+n);if(s&&q){s.focus();s.setSelectionRange(99,99)}}
function edit(n,i){const E=ENT[n],r=i==null?{}:S[n][i];
 if(i==null&&n=='Participants')r.id='TUR26-'+String(S.Participants.length+1).padStart(3,'0');
 $('#frm').innerHTML=`<h2>${i==null?'Add':'Edit'} ${n.slice(0,-1).toLowerCase()}</h2>`+E.f.map(f=>`<label>${f[1]}</label>`+(f[2]=='sel'?`<select name="${f[0]}"><option value="">– select –</option>${f[3].map(o=>`<option ${r[f[0]]==o?'selected':''}>${o}</option>`).join('')}</select>`:f[2]=='act'?`<select name="${f[0]}">${ACTS.map(x=>`<option value="${x.id}" ${r[f[0]]==x.id?'selected':''}>${x.name}</option>`).join('')}</select>`:f[2]=='cp'?`<select name="${f[0]}"><option value="">– none –</option>${cps().map(c=>`<option value="${esc(c.id)}" ${r[f[0]]==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]||'text'}" value="${f[2]=='password'?'':esc(r[f[0]])}" placeholder="${f[2]=='password'&&i!=null?'Leave blank to keep current':''}" autocomplete="new-password" ${f[0]==E.key&&i!=null?'readonly':''}>`)).join('')+
 `<div class="bar"><button class="btn" id="sv">Save</button><button class="btn ghost" type="button" onclick="$('#dlg').close()">Cancel</button></div>`;
 $('#sv').onclick=async()=>{const row={...r};E.f.forEach(f=>row[f[0]]=$(`[name=${f[0]}]`,$('#frm')).value.trim());
  if(!row[E.key])return toast(E.key+' is required','err');
  if(n=='Participants'&&!row.name)return toast('Name is required','err');
  if(E.f.some(f=>f[2]=='password')){const pw=row.password;row.password=pw?await hashPw(row.username,pw):(r.password||'');if(!row.password)return toast('Password is required','err')}
  if(i==null&&S[n].some(x=>x[E.key]==row[E.key]))return toast('That '+E.key+' already exists','err');
  const res=await api('save',{sheet:n,row});if(res.ok){$('#dlg').close();toast('Saved');load()}else toast(res.error,'err')};
 $('#dlg').showModal()}
async function del(n,i){const r=S[n][i];if(!confirm('Delete '+r[ENT[n].key]+'?'+(n=='Participants'?'\n\nAll checkpoint scans and activity records of this participant will also be deleted.':'')))return;const res=await api('remove',{sheet:n,key:r[ENT[n].key]});res.ok?(toast('Deleted'),load()):toast(res.error,'err')}

async function doScan(code){code=(code||'').trim();if(!code)return;const r=await api('scan',{code,checkpointId:$('#scp').value,force:$('#force').checked});
 const el=$('#sres');if(!r.ok){el.textContent=r.error;toast(r.error,'err');return beep(0)}
 el.innerHTML=r.status=='ok'?`✔ <b>${esc(r.name)}</b> (${esc(r.id)}) recorded at ${esc(cpName($('#scp').value))}`:esc(r.msg)+(r.name?' – '+esc(r.name):'');
 toast(r.status=='ok'?'Recorded':r.msg,r.status=='ok'?'ok':'warn');beep(r.status=='ok');$('#sman').value='';load()}

function cardEl(p){const d=document.createElement('div');d.className='pcard';
 d.innerHTML=`<div class="hd"><img src="logo.jpg" alt=""><div class="ev">TAHERI UNITY RIDE 2026<small>Burhani Guards Division-II</small></div></div>
 <div class="nm">${esc(p.name)}</div><div class="its">${esc(p.its||'')}</div><div class="ag">${[p.age?'Age '+esc(p.age):'',esc(p.gender||'')].filter(Boolean).join(' · ')}</div><div class="qr"></div><div class="pid">${esc(p.id)}</div><div class="ft">Show this QR at every checkpoint</div>`;
 const t=document.createElement('div');new QRCode(t,{text:p.id,width:400,height:400,correctLevel:QRCode.CorrectLevel.M});
 const im=new Image();im.src=t.querySelector('canvas').toDataURL('image/png');d.querySelector('.qr').appendChild(im);return d}
async function cardPNG(p){const el=cardEl(p),w=document.createElement('div');w.style.cssText='position:fixed;left:-9999px;top:0';w.appendChild(el);document.body.appendChild(w);
 try{await Promise.all([...el.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
  const c=await html2canvas(el,{scale:300/96,backgroundColor:'#ffffff',useCORS:true});   // 85x130 mm at 300 dpi
  const a=document.createElement('a');a.download=p.id+'_'+String(p.name).replace(/[^\w]+/g,'_')+'.png';a.href=c.toDataURL('image/png');a.click()}
 catch(e){toast('PNG failed: '+e.message,'err')}finally{w.remove()}}
function cardList(){const q=($('#cq').value||'').toLowerCase();return S.Participants.filter(p=>(p.id+' '+p.name+' '+(p.its||'')).toLowerCase().includes(q))}
async function allPNG(){for(const p of cardList()){await cardPNG(p);await new Promise(r=>setTimeout(r,400))}}
function renderCards(){const g=$('#cardgrid'),l=cardList();g.innerHTML='';if(!l.length){g.innerHTML='<p>No participants yet.</p>';return}
 l.forEach(p=>{const w=document.createElement('div');w.className='cwrap';w.appendChild(cardEl(p));
  const b=document.createElement('button');b.className='btn sm noprint';b.textContent='⬇ Download PNG';b.onclick=()=>cardPNG(p);w.appendChild(b);g.appendChild(w)})}
let curAct='A1';
const toL=t=>t?new Date(new Date(t)-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
const fromL=v=>v?new Date(v).toISOString():'';
function renderAct(){const a=ACTS.find(x=>x.id==curAct),logs=S.ActivityLogs.filter(x=>x.activityId==curAct);
 const key=x=>{if(!x.end)return null;const k=curAct=='A1'?-parseFloat(x.result):(new Date(x.end)-new Date(x.start))/1000;return isNaN(k)?null:k};
 logs.sort((p,q)=>{const m=key(p),n=key(q);return m===null?(n===null?0:1):n===null?-1:m-n});
 let rk=0,cnt=0,prev;logs.forEach(x=>{const k=key(x);if(k===null){x.rank='';return}cnt++;if(k!==prev){rk=cnt;prev=k}x.rank=rk});
 const nm=id=>(S.Participants.find(p=>p.id==id)||{}).name||'';
 const dur=(s,e)=>{if(!s||!e)return '–';const d=Math.round((new Date(e)-new Date(s))/1000);return Math.floor(d/60)+'m '+d%60+'s'};
 $('#act').innerHTML=`<div class="panel"><div class="bar"><h2>Activities</h2>${ACTS.map(x=>`<button class="btn ${x.id==curAct?'':'ghost'} sm" onclick="curAct='${x.id}';renderAct()">${x.name}</button>`).join('')}<button class="btn" onclick="editAct()">+ Add entry</button></div>
 <p style="color:var(--mu)">${esc(a.name)} – ranked by ${curAct=='A1'?'highest weight':'least duration'} – started ${logs.length} · completed ${logs.filter(x=>x.end).length}</p>
 <div class="tw"><table><tr><th>Rank</th><th>ID</th><th>Name</th><th>Start</th><th>End</th><th>Duration</th><th>${esc(a.label)}</th><th>Notes</th><th>By</th><th></th></tr>
 ${logs.map(x=>`<tr><td>${x.rank?(['🥇','🥈','🥉'][x.rank-1]||'')+' '+x.rank:''}</td><td>${esc(x.participantId)}</td><td>${esc(nm(x.participantId))}</td><td>${fmt(x.start)}</td><td>${fmt(x.end)}</td><td>${dur(x.start,x.end)}</td><td>${esc(x.result)}</td><td>${esc(x.notes)}</td><td>${esc(x.by)}</td>
 <td><button class="btn ghost sm" onclick="editAct('${esc(x.participantId)}')">Edit</button> <button class="btn red sm" onclick="delAct('${esc(x.participantId)}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function editAct(pid){const a=ACTS.find(x=>x.id==curAct),x=S.ActivityLogs.find(l=>l.activityId==curAct&&l.participantId==pid)||{};
 $('#frm').innerHTML=`<h2>${pid?'Edit':'Add'} – ${esc(a.name)}</h2><label>Participant ID</label><input name="pid" list="pl" value="${esc(x.participantId||'')}" ${pid?'readonly':''}><datalist id="pl">${S.Participants.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}`).join('')}</datalist>
 <label>Start time</label><input name="st" type="datetime-local" value="${toL(x.start)}"><label>End time</label><input name="en" type="datetime-local" value="${toL(x.end)}">
 <label>${esc(a.label)}</label><input name="rs" type="number" step="any" value="${esc(x.result||'')}"><label>Notes</label><input name="nt" value="${esc(x.notes||'')}">
 <div class="bar"><button class="btn" id="sv">Save</button><button class="btn ghost" type="button" onclick="$('#dlg').close()">Cancel</button></div>`;
 $('#sv').onclick=async()=>{const g=n=>$(`[name=${n}]`,$('#frm')).value.trim(),id=g('pid');
  if(!S.Participants.some(p=>p.id==id))return toast('Unknown participant ID','err');
  const res=await api('actSave',{row:{participantId:id,activityId:curAct,start:fromL(g('st')),end:fromL(g('en')),result:g('rs'),notes:g('nt')}});
  if(res.ok){$('#dlg').close();toast('Saved');load()}else toast(res.error,'err')};$('#dlg').showModal()}
async function delAct(pid){if(!confirm('Delete this entry?'))return;const r=await api('actRemove',{participantId:pid,activityId:curAct});r.ok?(toast('Deleted'),load()):toast(r.error,'err')}
boot();
</script></body></html>
